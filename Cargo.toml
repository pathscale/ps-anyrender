[workspace]
members = [
  "crates/anyrender",
  "crates/anyrender_serialize",
  "crates/anyrender_skia",
  "crates/anyrender_vello",
  "crates/anyrender_vello_cpu",
  "crates/anyrender_svg",
  "crates/wgpu_context",
  "crates/pixels_window_renderer",
  "crates/softbuffer_window_renderer",
  "examples/serialize",
]
# `crates/anyrender_vello_hybrid` is excluded, not deleted.
#
# ps-vello 0.2 redesigned the hybrid `Scene`: `SampleRect` and
# `draw_texture_rects` are gone and nothing named `draw_*` replaced them, so
# this backend needs a rewrite rather than the mechanical rename the CPU and GPU
# backends needed. Excluding it keeps `--workspace` honest - every member
# compiles and every test runs - instead of leaving six CI jobs red on a crate
# nobody in this repository depends on.
#
# It is still a real crate and still published at 0.10.0. Build it directly with
# `cargo check --manifest-path crates/anyrender_vello_hybrid/Cargo.toml` while
# porting; put it back in `members` when it compiles.
# `examples/player` and `examples/bunnymark` go with it: both render through
# `VelloHybridWindowRenderer`, so neither can build while that backend does not.
exclude = [
  "crates/anyrender_vello_hybrid",
  "examples/player",
  "examples/bunnymark",
]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/pathscale/ps-anyrender"
repository = "https://github.com/pathscale/ps-anyrender"
categories = ["gui"]
edition = "2024"
rust-version = "1.88.0"

[workspace.dependencies]
# AnyRender dependencies (in-repo)
anyrender = { package = "ps-anyrender", version = "0.13.0", path = "./crates/anyrender" }
anyrender_serialize = { version = "0.6.0", path = "./crates/anyrender_serialize" }
anyrender_skia = { version = "0.10.0", path = "./crates/anyrender_skia" }
anyrender_vello = { package = "ps-anyrender-vello", version = "0.14.0", path = "./crates/anyrender_vello" }
anyrender_vello_cpu = { package = "ps-anyrender-vello-cpu", version = "0.17.0", path = "./crates/anyrender_vello_cpu" }
anyrender_vello_hybrid = { package = "ps-anyrender-vello-hybrid", version = "0.10.0", path = "./crates/anyrender_vello_hybrid" }
anyrender_svg = { package = "ps-anyrender-svg", version = "0.15.0", path = "./crates/anyrender_svg" }
wgpu_context = { package = "ps-wgpu-context", version = "0.8.0", path = "./crates/wgpu_context" }
pixels_window_renderer = { version = "0.7.0", path = "./crates/pixels_window_renderer" }
softbuffer_window_renderer = { version = "0.7.0", path = "./crates/softbuffer_window_renderer" }

# Serialization
serde = "1.0.228"
serde_json = "1.0"
zip = { version = "2.1", default-features = false, features = ["deflate"] }
sha2 = "0.10"
skera = "=0.2.0"                                                            # pin because of breaking changes in past patch releases
read-fonts = "0.39"
ttf2woff2 = "0.11"
wuff = "0.2"

# Linebender

linebender_resource_handle = "0.1"
peniko = "0.6"
kurbo = "0.13.1"
color = "0.3"
# The ps-vello fork, by version.
#
# These were linebender's crates: `vello_cpu = "0.0.9"` resolved *their* copy,
# so the fork's rewritten `fine/mod.rs` was never in the graph no matter what
# any consumer pinned. Chuzz's headless capture aborted the process on any page
# with a backdrop, at
#
#   vello_cpu-0.0.9/src/fine/mod.rs:657: internal error: entered unreachable code
#
# which is upstream code failing, in a build that was supposed to be running the
# fork. The fork could not be published while it shared their names; it is
# `ps-vello-*` now, so naming it here is what actually puts it in the graph.
glifo = { package = "ps-glifo", version = "0.3.0" }
vello = { package = "ps-vello", version = "0.10.0", features = ["wgpu"] }
vello_cpu = { package = "ps-vello-cpu", version = "0.2.0", default-features = false, features = [
  "std",
  "text",
  "u8_pipeline",
] }
vello_hybrid = { package = "ps-vello-hybrid", version = "0.2.0" }
vello_common = { package = "ps-vello-common", version = "0.2.0" }

# Rendering
wgpu = "29"
raw-window-handle = "0.6.0"
softbuffer = "0.4"
pixels = "0.17"

# SVG
#
# `ps-usvg`, the fork this graph actually compiles against. `anyrender_svg`
# 0.14.0 was published while a `[patch.crates-io]` redirected `usvg` at a resvg
# branch, so `render_svg_tree` was built against that fork's `Arc<Tree>` while
# its published signature named the registry usvg's `Tree`. A consumer on the
# fork then gets `expected &Tree, found &Arc<Tree>` from a crate that compiles
# fine in this workspace. Naming the fork makes the published signature true.
usvg = { package = "ps-usvg", version = "0.48.1", default-features = false }
image = { version = "0.25", default-features = false }

# Other dependencies
debug_timer = "0.1.1"
rustc-hash = "2"
futures-util = "0.3.31"
futures-intrusive = "0.5.0"
futures-channel = "0.3"
pollster = "0.4"
wasm-bindgen-futures = "0.4"

# Dev-dependencies
winit = { version = "0.30.2", features = ["rwh_06"] }
