name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # For `check-wasm-hybrid`, which is manual on purpose. See its comment.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTDOCFLAGS: "-D warnings"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: "sparse"

jobs:

  # MSRV check.
  # AnyRender only guarantees "latest stable". However we have this check here to ensure that we advertise
  # our MSRV. We also make an effort not to increase MSRV in patch versions of AnyRender.
  #
  # We only run `cargo build` (not `cargo test`) so as to avoid requiring dev-dependencies to build with the MSRV
  # version. Building is likely sufficient as runtime errors varying between rust versions is very unlikely.
  build-msrv:
    name: "MSRV Build [Rust 1.92]"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92
      - name: Install development libraries on ubuntu
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - run: cargo build --workspace

  build-features-default:
    name: "Build [default features]"
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install development libraries on ubuntu
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev
      - run: cargo build --workspace

  fmt:
    name: Rustfmt
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace -- -D warnings

  doc:
    name: Documentation
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps

  # Manual. Run it from the Actions tab when you are working on wasm.
  #
  # Nothing here ships to wasm today: this repository's consumers are native,
  # and the one crate the `webgl` half existed to check,
  # `anyrender_vello_hybrid`, is excluded from the workspace until it is ported
  # to ps-vello 0.2, which redesigned the hybrid `Scene` out from under it. So
  # the job spent a runner on every push to answer a question nobody was asking,
  # and then went red for a reason unrelated to whatever was being pushed.
  #
  # Kept rather than deleted, because the answer stops being free the day
  # someone does target wasm, and a job that has to be reconstructed from
  # scratch is a job that does not get reconstructed.
  check-wasm:
    name: "Check [wasm32 + webgl]"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubicloud-standard-8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: "wasm32-unknown-unknown"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p ps-anyrender --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p ps-anyrender-vello --target wasm32-unknown-unknown -- -D warnings
      # `--manifest-path`, not `-p`: the crate is outside the workspace, so
      # cargo cannot select it by package name.
      - run: >
          cargo clippy --manifest-path crates/anyrender_vello_hybrid/Cargo.toml
          --target wasm32-unknown-unknown --features webgl -- -D warnings

  # just cargo check for now
  matrix_test:
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_CARGO_COMMAND: ${{ matrix.platform.cross == true && 'cross' || 'cargo' }}
    strategy:
      matrix:
        platform:
          # Windows and macOS test entries are deliberately absent: the paid
          # runners are not worth it when Linux validates the same code and
          # macOS is tested locally on the machine this is developed on. The
          # linux entry below already carries --all-features, which is the
          # widest of the three, so no feature coverage is lost with them.
          - {
              name: linux,
              target: x86_64-unknown-linux-gnu,
              os: ubicloud-standard-8,
              cross: false,
              command: "test",
              args: "--all --tests --all-features",
            }

    name: Test (${{ matrix.platform.name }})

    steps:
      - uses: actions/checkout@v4
      - name: install stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}
          components: rustfmt

      - name: Install cross
        if: ${{ matrix.platform.cross == true }}
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: "${{ matrix.platform.target }}"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: ${{ matrix.os != 'macos-latest' }} # works around https://github.com/Swatinem/rust-cache/issues/341

      - name: Install development libraries on ubuntu
        if: ${{ matrix.platform.os == 'ubicloud-standard-8' }}
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev

      - name: Setup
        run: ${{ matrix.platform.setup }} 
        shell: bash

      - name: test
        run: |
          ${{ env.RUST_CARGO_COMMAND }} ${{ matrix.platform.command }} ${{ matrix.platform.args }} --target ${{ matrix.platform.target }}
